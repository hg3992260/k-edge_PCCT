name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "slice_report_desktop.py"
      - "build_iodine_kedge_report.py"
      - "requirements-desktop-build.txt"
      - "scripts/build_windows_exe.py"
      - "scripts/pyi_rth_openjpeg.py"
      - ".github/workflows/build-exe.yml"
      - "reconstructed_weight_maps/logo/**"

jobs:
  build-windows:
    runs-on: windows-latest

    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: exe-build
          auto-activate-base: false
          channels: conda-forge,defaults
          channel-priority: strict
          python-version: "3.11"

      - name: Install Build Dependencies
        run: |
          conda install -y \
            pyinstaller=6.10 \
            pyqt=5.15 \
            pyqtwebengine=5.15 \
            numpy=1.26 \
            scipy=1.13 \
            matplotlib=3.8 \
            pillow=10 \
            pydicom=3.0 \
            glymur=0.14 \
            openjpeg=2.5

      - name: Verify OpenJPEG
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          prefix = Path(os.environ["CONDA_PREFIX"])
          candidates = [
              prefix / "Library" / "bin" / "openjp2.dll",
              prefix / "bin" / "openjp2.dll",
          ]
          for path in candidates:
              if path.exists():
                  print(f"FOUND_OPENJP2={path}")
                  break
          else:
              raise SystemExit("openjp2.dll not found in conda environment")
          PY

      - name: Verify Python Imports
        run: |
          python - <<'PY'
          import glymur
          import pydicom
          import PyQt5
          from PyQt5.QtWebEngineWidgets import QWebEngineView

          print("glymur", glymur.__version__)
          print("pydicom", pydicom.__version__)
          print("PyQt5 ok")
          print("QtWebEngine ok", QWebEngineView)
          PY

      - name: Build EXE
        run: |
          python scripts/build_windows_exe.py

      - name: Check Build Outputs
        run: |
          test -f dist/KEdgeSliceReport.exe
          test -f release/KEdgeSliceReport-windows.zip
          ls -lh dist/KEdgeSliceReport.exe
          ls -lh release/KEdgeSliceReport-windows.zip

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: KEdgeSliceReport-windows-exe
          path: dist/KEdgeSliceReport.exe

      - name: Upload EXE Zip
        uses: actions/upload-artifact@v4
        with:
          name: KEdgeSliceReport-windows-zip
          path: release/KEdgeSliceReport-windows.zip
