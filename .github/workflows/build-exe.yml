name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "slice_report_desktop.py"
      - "build_iodine_kedge_report.py"
      - "requirements-desktop-build.txt"
      - "scripts/build_windows_exe.py"
      - ".github/workflows/build-exe.yml"
      - "reconstructed_weight_maps/logo/**"

permissions:
  contents: read

concurrency:
  group: build-windows-exe-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  KMP_DUPLICATE_LIB_OK: "TRUE"

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: exe-build
          auto-activate-base: false
          python-version: "3.11"
          packages: pip setuptools wheel
          channels: conda-forge
          channel-priority: strict

      - name: Ensure Pip In Conda Env
        run: |
          conda install -y pip setuptools wheel
          python -m ensurepip --upgrade || true

      - name: Install OpenJPEG
        run: |
          conda install -y -c conda-forge openjpeg

      - name: Install Python Dependencies
        run: |
          where python || true
          python --version
          python -m pip --version
          python -m pip install --upgrade pip
          python -m pip install -r requirements-desktop-build.txt
          python -m pip uninstall -y torch || true
          python -m pip install --no-cache-dir --force-reinstall --index-url https://download.pytorch.org/whl/cu121 "torch==2.5.1+cu121"

      - name: Show Build Environment
        run: |
          python --version
          python -m pip --version
          conda info
          conda list | grep -E "openjpeg|pyqt|pyinstaller|glymur|pydicom|numpy|scipy|matplotlib|pillow|torch" || true
          python - <<'PY'
          import os
          from pathlib import Path
          import torch
          candidates = []
          conda_prefix = os.environ.get("CONDA_PREFIX")
          if conda_prefix:
              candidates.extend(
                  [
                      Path(conda_prefix) / "Library" / "bin" / "openjp2.dll",
                      Path(conda_prefix) / "bin" / "openjp2.dll",
                  ]
              )
          for item in candidates:
              print(f"CHECK_OPENJP2 {item} exists={item.exists()}")
          print(f"TORCH_VERSION {torch.__version__}")
          print(f"TORCH_CUDA_RUNTIME {torch.version.cuda}")
          print(f"TORCH_CUDA_AVAILABLE {torch.cuda.is_available()}")
          if not str(torch.version.cuda or "").strip():
              raise SystemExit("GitHub Actions 未安装到 CUDA 版 PyTorch wheel，停止构建。")
          PY

      - name: Build EXE
        env:
          KEDGE_DISABLE_CUDA: "1"
        run: |
          python scripts/build_windows_exe.py

      - name: Verify Build Outputs
        run: |
          test -f dist/KEdgeSliceReport.exe
          test -f release/KEdgeSliceReport-windows.zip
          ls -lah dist
          ls -lah release

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: KEdgeSliceReport-windows-exe
          path: dist/KEdgeSliceReport.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload EXE Zip
        uses: actions/upload-artifact@v4
        with:
          name: KEdgeSliceReport-windows-zip
          path: release/KEdgeSliceReport-windows.zip
          if-no-files-found: error
          retention-days: 14
