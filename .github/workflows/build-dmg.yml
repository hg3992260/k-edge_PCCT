name: Build macOS DMG

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "slice_report_desktop.py"
      - "build_iodine_kedge_report.py"
      - "requirements-desktop-build.txt"
      - ".github/workflows/build-dmg.yml"
      - "reconstructed_weight_maps/logo/**"

permissions:
  contents: read

concurrency:
  group: build-macos-dmg-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  KMP_DUPLICATE_LIB_OK: "TRUE"

jobs:
  build-macos:
    runs-on: macos-13
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: dmg-build
          auto-activate-base: false
          python-version: "3.11"
          packages: pip setuptools wheel
          channels: conda-forge
          channel-priority: strict

      - name: Ensure Pip In Conda Env
        run: |
          conda install -y pip setuptools wheel
          python -m ensurepip --upgrade || true

      - name: Install OpenJPEG
        run: |
          conda install -y -c conda-forge openjpeg

      - name: Install Python Dependencies
        run: |
          which python
          python --version
          python -m pip --version
          python -m pip install --upgrade pip
          python -m pip install -r requirements-desktop-build.txt

      - name: Show Build Environment
        run: |
          python --version
          python -m pip --version
          conda info
          conda list | grep -E "openjpeg|pyqt|pyinstaller|glymur|pydicom|numpy|scipy|matplotlib|pillow" || true
          python - <<'PY'
          import os
          from pathlib import Path
          candidates = []
          conda_prefix = os.environ.get("CONDA_PREFIX")
          if conda_prefix:
              candidates.extend(
                  [
                      Path(conda_prefix) / "lib" / "libopenjp2.dylib",
                      Path(conda_prefix) / "lib" / "libopenjp2.7.dylib",
                  ]
              )
          for item in candidates:
              print(f"CHECK_OPENJP2 {item} exists={item.exists()}")
          PY

      - name: Build macOS App
        run: |
          set -euxo pipefail
          OPENJPEG_DYLIB="$(python - <<'PY'
          import os
          from pathlib import Path
          candidates = []
          conda_prefix = os.environ.get("CONDA_PREFIX")
          if conda_prefix:
              candidates.extend(
                  [
                      Path(conda_prefix) / "lib" / "libopenjp2.dylib",
                      Path(conda_prefix) / "lib" / "libopenjp2.7.dylib",
                  ]
              )
          for item in candidates:
              if item.exists():
                  print(item)
                  break
          PY
          )"
          if [ -z "${OPENJPEG_DYLIB}" ]; then
            echo "OpenJPEG dynamic library not found"
            exit 1
          fi
          python -m PyInstaller \
            slice_report_desktop.py \
            --noconfirm \
            --clean \
            --windowed \
            --name KEdgeSliceReport \
            --distpath dist \
            --workpath build \
            --specpath build \
            --hidden-import PyQt5.QtWebEngineWidgets \
            --hidden-import PyQt5.QtWebEngineCore \
            --hidden-import PyQt5.QtWebChannel \
            --collect-submodules glymur \
            --collect-submodules matplotlib \
            --collect-data matplotlib \
            --add-data "reconstructed_weight_maps/logo:reconstructed_weight_maps/logo" \
            --add-binary "${OPENJPEG_DYLIB}:."

      - name: Build DMG
        run: |
          set -euxo pipefail
          mkdir -p release/dmg-root
          cp -R "dist/KEdgeSliceReport.app" "release/dmg-root/"
          hdiutil create \
            -volname "KEdgeSliceReport" \
            -srcfolder "release/dmg-root" \
            -ov \
            -format UDZO \
            "release/KEdgeSliceReport-macos.dmg"

      - name: Verify Build Outputs
        run: |
          test -d dist/KEdgeSliceReport.app
          test -f release/KEdgeSliceReport-macos.dmg
          ls -lah dist
          ls -lah release

      - name: Upload macOS App
        uses: actions/upload-artifact@v4
        with:
          name: KEdgeSliceReport-macos-app
          path: dist/KEdgeSliceReport.app
          if-no-files-found: error
          retention-days: 14

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: KEdgeSliceReport-macos-dmg
          path: release/KEdgeSliceReport-macos.dmg
          if-no-files-found: error
          retention-days: 14
