name: Build macOS DMG

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "slice_report_desktop.py"
      - "build_iodine_kedge_report.py"
      - "requirements-desktop-build.txt"
      - ".github/workflows/build-dmg.yml"
      - "reconstructed_weight_maps/logo/**"

permissions:
  contents: read

concurrency:
  group: build-macos-dmg-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_NAME: KEdgeSliceReport
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  KMP_DUPLICATE_LIB_OK: "TRUE"

jobs:
  build-macos:
    runs-on: macos-latest
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: dmg-build
          auto-activate-base: false
          python-version: "3.11"
          channels: conda-forge
          channel-priority: strict

      - name: Bootstrap Build Environment
        run: |
          conda install -y -n dmg-build -c conda-forge python=3.11 pip setuptools wheel

      - name: Install OpenJPEG
        run: |
          conda install -y -c conda-forge openjpeg

      - name: Install Python Dependencies
        run: |
          python --version
          python -m pip --version
          python -m pip install --upgrade pip
          python -m pip install -r requirements-desktop-build.txt

      - name: Resolve OpenJPEG Path
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          conda_prefix = os.environ.get("CONDA_PREFIX", "")
          candidates = [
              Path(conda_prefix) / "lib" / "libopenjp2.dylib",
              Path(conda_prefix) / "lib" / "libopenjp2.7.dylib",
          ]
          for item in candidates:
              if item.exists():
                  with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
                      fh.write(f"OPENJPEG_SOURCE_DYLIB={item}\n")
                  break
          else:
              raise SystemExit("OpenJPEG dynamic library not found in conda environment")
          PY

      - name: Stage OpenJPEG Runtime
        run: |
          set -euxo pipefail
          WORKSPACE_DIR="${GITHUB_WORKSPACE:-$PWD}"
          mkdir -p "${WORKSPACE_DIR}/build"
          cp -L "${OPENJPEG_SOURCE_DYLIB}" "${WORKSPACE_DIR}/build/libopenjp2.dylib"
          echo "OPENJPEG_DYLIB=${WORKSPACE_DIR}/build/libopenjp2.dylib" >> "${GITHUB_ENV}"

      - name: Build macOS Icon
        run: |
          set -euxo pipefail
          WORKSPACE_DIR="${GITHUB_WORKSPACE:-$PWD}"
          ICON_SOURCE="$(find "${WORKSPACE_DIR}/reconstructed_weight_maps/logo" -maxdepth 1 -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.bmp' \) | head -n 1)"
          test -n "${ICON_SOURCE}"
          ICONSET_DIR="${WORKSPACE_DIR}/build/app.iconset"
          ICON_PATH="${WORKSPACE_DIR}/build/app_icon.icns"
          rm -rf "${ICONSET_DIR}"
          mkdir -p "${ICONSET_DIR}"
          sips -s format png -z 16 16 "${ICON_SOURCE}" --out "${ICONSET_DIR}/icon_16x16.png"
          sips -s format png -z 32 32 "${ICON_SOURCE}" --out "${ICONSET_DIR}/icon_16x16@2x.png"
          sips -s format png -z 32 32 "${ICON_SOURCE}" --out "${ICONSET_DIR}/icon_32x32.png"
          sips -s format png -z 64 64 "${ICON_SOURCE}" --out "${ICONSET_DIR}/icon_32x32@2x.png"
          sips -s format png -z 128 128 "${ICON_SOURCE}" --out "${ICONSET_DIR}/icon_128x128.png"
          sips -s format png -z 256 256 "${ICON_SOURCE}" --out "${ICONSET_DIR}/icon_128x128@2x.png"
          sips -s format png -z 256 256 "${ICON_SOURCE}" --out "${ICONSET_DIR}/icon_256x256.png"
          sips -s format png -z 512 512 "${ICON_SOURCE}" --out "${ICONSET_DIR}/icon_256x256@2x.png"
          sips -s format png -z 512 512 "${ICON_SOURCE}" --out "${ICONSET_DIR}/icon_512x512.png"
          sips -s format png -z 1024 1024 "${ICON_SOURCE}" --out "${ICONSET_DIR}/icon_512x512@2x.png"
          iconutil -c icns "${ICONSET_DIR}" -o "${ICON_PATH}"
          echo "APP_ICON_ICNS=${ICON_PATH}" >> "${GITHUB_ENV}"

      - name: Build macOS App
        run: |
          set -euxo pipefail
          WORKSPACE_DIR="${GITHUB_WORKSPACE:-$PWD}"
          python -m PyInstaller \
            "${WORKSPACE_DIR}/slice_report_desktop.py" \
            --noconfirm \
            --clean \
            --windowed \
            --name "${APP_NAME}" \
            --icon "${APP_ICON_ICNS}" \
            --distpath dist \
            --workpath build \
            --specpath build \
            --hidden-import PyQt5.QtWebEngineWidgets \
            --hidden-import PyQt5.QtWebEngineCore \
            --hidden-import PyQt5.QtWebChannel \
            --collect-submodules glymur \
            --collect-submodules matplotlib \
            --collect-data matplotlib \
            --add-data "${WORKSPACE_DIR}/reconstructed_weight_maps/logo:reconstructed_weight_maps/logo" \
            --add-binary "${OPENJPEG_DYLIB}:."

      - name: Build DMG
        run: |
          set -euxo pipefail
          mkdir -p release/dmg-root
          cp -R "dist/${APP_NAME}.app" "release/dmg-root/"
          ln -s /Applications "release/dmg-root/Applications"
          hdiutil create \
            -volname "${APP_NAME}" \
            -srcfolder "release/dmg-root" \
            -ov \
            -format UDZO \
            "release/${APP_NAME}-macos.dmg"

      - name: Verify Build Outputs
        run: |
          test -d "dist/${APP_NAME}.app"
          test -f "release/${APP_NAME}-macos.dmg"
          ls -lah dist
          ls -lah release

      - name: Upload macOS App
        uses: actions/upload-artifact@v4
        with:
          name: KEdgeSliceReport-macos-app
          path: dist/KEdgeSliceReport.app
          if-no-files-found: error
          retention-days: 14

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: KEdgeSliceReport-macos-dmg
          path: release/KEdgeSliceReport-macos.dmg
          if-no-files-found: error
          retention-days: 14
