name: Build macOS DMG

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "slice_report_desktop.py"
      - "build_iodine_kedge_report.py"
      - "requirements-desktop-build.txt"
      - ".github/workflows/build-dmg.yml"
      - "reconstructed_weight_maps/logo/**"

permissions:
  contents: read

concurrency:
  group: build-macos-dmg-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_NAME: KEdgeSliceReport
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  KMP_DUPLICATE_LIB_OK: "TRUE"

jobs:
  build-macos:
    runs-on: macos-latest
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: dmg-build
          auto-activate-base: false
          python-version: "3.11"
          channels: conda-forge
          channel-priority: strict

      - name: Bootstrap Build Environment
        run: |
          conda install -y -n dmg-build -c conda-forge python=3.11 pip setuptools wheel

      - name: Install OpenJPEG
        run: |
          conda install -y -c conda-forge openjpeg

      - name: Install Python Dependencies
        run: |
          python --version
          python -m pip --version
          python -m pip install --upgrade pip
          python -m pip install -r requirements-desktop-build.txt

      - name: Resolve OpenJPEG Path
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          conda_prefix = os.environ.get("CONDA_PREFIX", "")
          candidates = [
              Path(conda_prefix) / "lib" / "libopenjp2.dylib",
              Path(conda_prefix) / "lib" / "libopenjp2.7.dylib",
          ]
          for item in candidates:
              if item.exists():
                  with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
                      fh.write(f"OPENJPEG_DYLIB={item}\n")
                  break
          else:
              raise SystemExit("OpenJPEG dynamic library not found in conda environment")
          PY

      - name: Build macOS App
        run: |
          set -euxo pipefail
          python -m PyInstaller \
            slice_report_desktop.py \
            --noconfirm \
            --clean \
            --windowed \
            --name "${APP_NAME}" \
            --distpath dist \
            --workpath build \
            --specpath build \
            --hidden-import PyQt5.QtWebEngineWidgets \
            --hidden-import PyQt5.QtWebEngineCore \
            --hidden-import PyQt5.QtWebChannel \
            --collect-submodules glymur \
            --collect-submodules matplotlib \
            --collect-data matplotlib \
            --add-data "reconstructed_weight_maps/logo:reconstructed_weight_maps/logo" \
            --add-binary "${OPENJPEG_DYLIB}:."

      - name: Build DMG
        run: |
          set -euxo pipefail
          mkdir -p release/dmg-root
          cp -R "dist/${APP_NAME}.app" "release/dmg-root/"
          ln -s /Applications "release/dmg-root/Applications"
          hdiutil create \
            -volname "${APP_NAME}" \
            -srcfolder "release/dmg-root" \
            -ov \
            -format UDZO \
            "release/${APP_NAME}-macos.dmg"

      - name: Verify Build Outputs
        run: |
          test -d "dist/${APP_NAME}.app"
          test -f "release/${APP_NAME}-macos.dmg"
          ls -lah dist
          ls -lah release

      - name: Upload macOS App
        uses: actions/upload-artifact@v4
        with:
          name: KEdgeSliceReport-macos-app
          path: dist/KEdgeSliceReport.app
          if-no-files-found: error
          retention-days: 14

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: KEdgeSliceReport-macos-dmg
          path: release/KEdgeSliceReport-macos.dmg
          if-no-files-found: error
          retention-days: 14
